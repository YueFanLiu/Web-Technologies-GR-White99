server:
  port: ${PORT:${SERVER_PORT:9192}}

supabase:
  url: ${SUPABASE_URL}
  publishable-key: ${SUPABASE_PUBLISHABLE_KEY}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  storage:
    images-bucket: ${SUPABASE_IMAGES_BUCKET:images}
    max-image-size-bytes: ${SUPABASE_MAX_IMAGE_SIZE_BYTES:2097152}

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_ISSUER_URI:${supabase.url}/auth/v1}
          jwk-set-uri: ${SUPABASE_JWK_SET_URI:${supabase.url}/auth/v1/.well-known/jwks.json}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}

security:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:*}
  jwt:
    hmac-secret: ${SUPABASE_JWT_SECRET:}
